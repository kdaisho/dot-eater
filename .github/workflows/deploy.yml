name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

# Let an in-progress deployment finish; queue the next one behind it.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # configure-pages only reads the Pages site settings.
            pages: read
        steps:
            - uses: actions/checkout@v7

            # Fail fast if Pages isn't enabled, before installing and building.
            - uses: actions/configure-pages@v6

            # Installs vp and Node; pnpm version comes from package.json#packageManager.
            - uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version: 24
                  cache: true
                  run-install: false

            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm test
            # Only the admin passphrase's hash goes in the build (see
            # vite.config.ts).
            - run: pnpm build
              env:
                  ADMIN_PASSPHRASE: ${{ secrets.ADMIN_PASSPHRASE }}

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
